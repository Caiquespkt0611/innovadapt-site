# Configuração do deploy. Lido por scripts/deploy.sh.
PROJETO="Site InnovAdapt"
GIT_EMAILS="caique.spkt0611@gmail.com 212604769+Caiquespkt0611@users.noreply.github.com"

# este projeto não tem backend próprio
BACK=""

# A produção é a HOSTINGER, não a Vercel. innovadapt.com.br resolve para
# 82.25.67.96, servidor LiteSpeed da Hostinger — foi de lá que veio o alerta das
# 26 vulnerabilidades em 25/08/2026, lendo o package.json do servidor. Este
# arquivo apontava para a Vercel, então `npm run deploy` atualizava o lugar
# errado: o innovadapt.vercel.app existe, mas o domínio não passa por ele.
#
# A Hostinger tem AUTO-DEPLOY ligado: ela puxa do GitHub sozinha, roda npm
# install e build, e só então troca o link da versão ativa. Publicar aqui é
# empurrar o commit — não há botão a apertar no painel.
FRONT="hostinger"
FRONT_DIR="."
FRONT_URL="https://innovadapt.com.br"

# Como o servidor é montado (conferido por SSH em 25/08/2026):
#   hbuilds/last-source     clone do GitHub, é o que ela atualiza
#   hbuilds/versions/<id>   cada build numa pasta própria
#   hbuilds/current         link para a versão ativa — é assim que troca e reverte
#   public_html/.htaccess   aponta o Passenger para current/nodejs, com Node 22
#
# ⚠️ A pasta `nodejs/` na raiz do domínio é um build ÓRFÃO de 17/06 e ainda tem
# next@16.2.7. Parece o app e não é: o .htaccess não olha para ela. Mexer ali
# não muda nada no ar.
#
# Com estas duas variáveis o deploy CONFIRMA a publicação comparando o commit
# do servidor com o local. Sem elas, o script só sabe dizer que o site responde
# — de fora não dá para distinguir a versão: os nomes dos arquivos do Next
# derivam do caminho dos módulos, não do conteúdo, e ficam iguais.
HOSTINGER_SSH="-p 65002 u633162582@82.25.67.96"
HOSTINGER_SOURCE="/home/u633162582/domains/innovadapt.com.br/hbuilds/last-source"

# Antes de publicar: sem vulnerabilidade alta e com build de pé. Foi o que fez
# as 26 do alerta virarem zero, e é o que impede a próxima passar batida.
PRE_CHECK='
  npm audit --audit-level=high >/dev/null 2>&1 \
    || { echo "     npm audit acusou falha alta: rode npm audit"; exit 1; }
  npm run build >/dev/null 2>&1 \
    || { echo "     o build falhou: rode npm run build para ver"; exit 1; }
'
