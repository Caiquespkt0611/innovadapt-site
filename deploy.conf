# Configuração do deploy. Lido por scripts/deploy.sh.
PROJETO="Site InnovAdapt"
GIT_EMAILS="caique.spkt0611@gmail.com 212604769+Caiquespkt0611@users.noreply.github.com"

# este projeto não tem backend próprio
BACK=""

# A produção é a HOSTINGER, não a Vercel. innovadapt.com.br resolve para
# 82.25.67.96, servidor LiteSpeed da Hostinger — foi de lá que veio o alerta das
# 26 vulnerabilidades em 25/08/2026, lendo o package.json do servidor. Este
# arquivo apontava para a Vercel, então `npm run deploy` atualizava o lugar
# errado: o innovadapt.vercel.app existe, mas o domínio não passa por ele.
#
# A Hostinger publica puxando do GitHub, pelo painel — não tem CLI. Aqui o
# `npm run deploy` empurra o commit e avisa o passo que falta:
#   hPanel → seu site → Git → Deploy (ou Pull)
FRONT="hostinger"
FRONT_DIR="."
FRONT_URL="https://innovadapt.com.br"

# Antes de publicar: sem vulnerabilidade alta e com build de pé. Foi o que fez
# as 26 do alerta virarem zero, e é o que impede a próxima passar batida.
PRE_CHECK='
  npm audit --audit-level=high >/dev/null 2>&1 \
    || { echo "     npm audit acusou falha alta: rode npm audit"; exit 1; }
  npm run build >/dev/null 2>&1 \
    || { echo "     o build falhou: rode npm run build para ver"; exit 1; }
'
